# Data configuration (SPEC §2).
# Screen2Words captions bundled with RICO screenshots (CC-BY-4.0).
# Native splits: train 15700 / val 2360 / test 4310 (total 22417).
dataset_id: rootsautomation/RICO-Screen2Words
rico_id: rootsautomation/RICO-Screen2Words   # source for Phase 7 augmentation

data_dir: data
raw_dir: data/raw
processed_dir: data/processed

# Single source of truth for the task prompt (SPEC §2). The teacher is prompted
# with this, and the student is trained to reproduce the teacher's answer.
prompt_template: >-
  Describe this UI screenshot in one sentence, then list the key interface
  elements as a comma-separated list.

max_target_length: 256
max_references: 5

# Use the dataset's native train/val/test splits (scientifically comparable to
# the literature). When false, fall back to the deterministic hash-based split
# below (used for combined / synthetic corpora in Phase 7).
use_native_splits: true
split:
  train: 0.9
  val: 0.05
  test: 0.05
  seed: 42
