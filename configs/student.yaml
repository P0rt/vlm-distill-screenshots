# Student VLM configuration (SPEC §2).
# Default student: Qwen2-VL-2B-Instruct, fine-tuned with LoRA (~3.5x smaller than teacher).
# backend: mlx (Apple Silicon) | hf (CUDA). mlx_model_id is a bf16 MLX checkpoint
# so LoRA adapters train in full precision.
backend: mlx
model_id: Qwen/Qwen2-VL-2B-Instruct
mlx_model_id: mlx-community/Qwen2-VL-2B-Instruct-bf16
dtype: bfloat16

# Visual token budget: cap screenshots at <=512 vision tokens so the sequence
# fits in max_seq_length during LoRA training (RICO screenshots are large).
min_pixels: 200704     # 256 * 28 * 28
max_pixels: 401408     # 512 * 28 * 28

lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj]

# Backup architecture: frozen SigLIP vision encoder + small Qwen2.5-0.5B decoder
# with a trainable projection bridge. Disabled by default.
fallback:
  enabled: false
  vision_model_id: google/siglip-so400m-patch14-384
  decoder_model_id: Qwen/Qwen2.5-0.5B
