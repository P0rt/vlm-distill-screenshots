[project]
name = "vlm-distill-screenshots"
version = "0.1.0"
description = "Knowledge distillation of a Qwen2-VL teacher into a compact student for screenshot understanding."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "vlm-distill-screenshots contributors" }]

# Core runtime deps — kept lightweight so CI (lint/type/test) stays cheap.
# The heavy ML stack lives in the optional `ml` group below and is NOT
# installed in the default CI job.
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Data stack (Phase 2): lightweight, no torch. `uv sync --extra data`.
data = [
    "datasets>=2.20",
    "pillow>=10.0",
    "numpy>=1.26",
    "pyarrow>=16.0",
    "huggingface-hub>=0.24",
]
# Plotting for the article figures. `uv sync --extra viz`.
viz = [
    "matplotlib>=3.8",
]
# Apple Silicon inference backend (Phase 3+): teacher/student via MLX.
# `uv sync --extra mlx`. Only installs on macOS arm64.
mlx = [
    "vlm-distill-screenshots[data]",
    "mlx-vlm>=0.6; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
# Heavy CUDA ML stack (Phases 3-8). `uv sync --extra ml` (needs a GPU box).
ml = [
    "vlm-distill-screenshots[data]",
    "torch>=2.3",
    "torchvision>=0.18",
    "transformers>=4.45",
    "accelerate>=0.33",
    "peft>=0.12",
    "bitsandbytes>=0.43; platform_system == 'Linux'",
    "wandb>=0.17",
    "qwen-vl-utils>=0.0.8",
    "evaluate>=0.4",
    "onnx>=1.16",
    "onnxruntime>=1.18",
]

[project.scripts]
vlm-download = "vlm_distill.data.download:main"
vlm-build-dataset = "vlm_distill.data.build_dataset:main"
vlm-teacher-label = "vlm_distill.data.teacher_label:main"
vlm-train = "vlm_distill.train:main"
vlm-eval = "vlm_distill.eval:main"
vlm-benchmark = "vlm_distill.benchmark:main"
vlm-export = "vlm_distill.export:main"

[dependency-groups]
# Dev tooling, installed by default `uv sync`.
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vlm_distill"]

# ---------------------------------------------------------------------------
# Tooling config
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
files = ["src"]
# Heavy ML deps are not installed in the lint/type CI job; ignore missing stubs
# for the modules they would provide so `mypy src` stays green without them.
# Modules are added to this list as each phase starts importing them.
[[tool.mypy.overrides]]
module = [
    "torch.*",
    "PIL.*",
    "datasets.*",
    "transformers.*",
    "mlx.*",
    "mlx_vlm.*",
    "peft.*",
]
ignore_missing_imports = true
# Treat these optional deps as untyped (Any) whether or not they are installed,
# so `mypy src` behaves identically in CI (deps absent) and on a dev box with
# the `ml`/`mlx` extras installed (deps present but flagged as untyped calls).
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
